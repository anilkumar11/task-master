name: Task
description: Add a to-do task
labels: ["P2"]
body:
  - type: textarea
    id: context
    attributes:
      label: Context
      description: What is this and why does it matter? Links welcome.
    validations:
      required: false
  - type: textarea
    id: done-when
    attributes:
      label: Done when
      description: How will you (or Claude) know it's finished?
      placeholder: "- [ ] ..."
  - type: input
    id: workspace
    attributes:
      label: Workspace
      description: Where Claude may work if delegated (repo, doc, account, or "research only")
  - type: input
    id: due
    attributes:
      label: Due
      description: "Format: Due: YYYY-MM-DD"
      placeholder: "Due: 2026-10-20"
  - type: input
    id: repeat
    attributes:
      label: Repeat
      description: "Optional. Repeat: daily | weekly:Mon | monthly:1"
      placeholder: "Repeat: weekly:Mon"
